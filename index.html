<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>เช็กก่อนออกจากบ้าน</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1fa;--card:#fff;--tx:#14213d;--mu:#6b7490;--ln:#e3e7f3;--ok:#19c37d;--pass:#2f5bff;--pass2:#5b3dff;--sun:#ffd23f;--sh:0 10px 30px rgba(30,50,140,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151b33;--tx:#eef1ff;--mu:#8d96b8;--ln:#252d4d;--sh:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#151b33;--tx:#eef1ff;--mu:#8d96b8;--ln:#252d4d;--sh:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Prompt','Noto Sans Thai',system-ui,sans-serif;line-height:1.45}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:left}
#app{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.hero{position:relative;display:flex;align-items:stretch;background:linear-gradient(135deg,var(--pass),var(--pass2));color:#fff;border-radius:22px;box-shadow:var(--sh);transition:background .5s}
.hero.all{background:linear-gradient(135deg,#0fa968,#2bd68f)}
.hero:before,.hero:after{content:"";position:absolute;right:104px;width:20px;height:20px;border-radius:50%;background:var(--bg);margin-right:-10px}
.hero:before{top:-10px}.hero:after{bottom:-10px}
.hero .l{flex:1;padding:18px 16px 18px 20px;min-width:0}
.hero .r{width:104px;display:grid;place-items:center;border-left:2px dashed rgba(255,255,255,.45);position:relative}
.dt{font-size:13px;opacity:.85}.sy{margin-left:10px;font-weight:600}
.hero h1{margin:2px 0 4px;font-size:22px;line-height:1.25;font-weight:700}
.hero p{margin:0;font-size:13px;opacity:.9}
.ring{position:relative;width:70px;height:70px}
.ring svg{width:100%;height:100%}
.tr{fill:none;stroke:rgba(255,255,255,.28);stroke-width:6}
.pg{fill:none;stroke:var(--sun);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s}
.hero.all .pg{stroke:#fff}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px}
.lbl{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px;font-size:14px;font-weight:600}
.lbl span,.lnk{font-size:12px;font-weight:400;color:var(--mu)}
.lnk{color:var(--pass);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{--c:#2f5bff;padding:7px 13px;border-radius:99px;font-size:14px;border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent);transition:.15s}
.chip.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 2px 8px;font-weight:700;font-size:16px}
.sec em{font-style:normal;font-size:13px;font-weight:600;color:var(--mu);background:var(--card);padding:2px 10px;border-radius:99px}
.add{font-size:13px;font-weight:600;color:var(--pass);background:var(--card);padding:4px 12px;border-radius:99px}
.list{background:var(--card);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.row{--c:#2f5bff;display:flex;align-items:center;gap:13px;width:100%;padding:12px 16px;border-top:1px solid var(--ln);min-height:64px;transition:background .2s}
.row:first-child{border-top:0}
.row:active{background:color-mix(in srgb,var(--c) 8%,transparent)}
.tile{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--c,#2f5bff) 16%,transparent)}
.nm{flex:1;min-width:0;font-size:16px;font-weight:600;transition:.25s}
.nm small{display:block;font-size:12px;font-weight:400;color:var(--mu)}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.ck{flex:none;width:32px;height:32px;border-radius:50%;border:2.5px solid var(--ln);display:grid;place-items:center;transition:.2s}
.ck svg{width:18px;stroke:#fff;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s .05s}
.row.done .ck{background:var(--ok);border-color:var(--ok)}
.row.done .ck svg{stroke-dashoffset:0}
.row.done .nm{color:var(--mu);text-decoration:line-through;text-decoration-thickness:2px}
.row.done .tile{filter:grayscale(1);opacity:.5}
.row.pop .ck{animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}50%{transform:scale(1.3) rotate(-8deg)}100%{transform:scale(1)}}
.chev{color:var(--mu);font-size:22px}
.top h2{margin:8px 2px 2px;font-size:24px}.top p{margin:0 2px;color:var(--mu);font-size:14px}
.day{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:14px;margin-top:12px}
.day.td{outline:2.5px solid var(--sun)}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.dh i{font-style:normal;font-size:11px;font-weight:700;background:var(--sun);color:#14213d;padding:1px 9px;border-radius:99px}
.dh span{margin-left:auto;font-size:13px;color:var(--mu)}
.ft{text-align:center;color:var(--mu);font-size:12px;margin-top:22px}
#nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:4px;background:var(--card);padding:6px;border-radius:99px;box-shadow:0 8px 30px rgba(20,30,80,.28);z-index:5}
#nav button{display:flex;align-items:center;gap:6px;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;color:var(--mu)}
#nav button span{font-size:18px}
#nav button.on{background:var(--pass);color:#fff}
#sheet{position:fixed;inset:0;z-index:10;display:none}
#sheet.open{display:block}
.bk{position:absolute;inset:0;background:rgba(10,15,40,.5)}
.pn{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;max-height:88%;overflow:auto;background:var(--card);border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 20px);animation:up .25s}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 12px}
.pn h3{margin:0 0 12px}
.f{display:flex;gap:10px}
.f input{font:inherit;color:var(--tx);background:var(--bg);border:2px solid transparent;border-radius:14px;padding:12px 14px;min-width:0;flex:1}
.f input:focus{outline:0;border-color:var(--pass)}
.f .ei{flex:none;width:64px;text-align:center;font-size:24px;padding:8px}
.emo{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.emo button{font-size:22px;width:38px;height:38px;border-radius:10px;text-align:center}
.emo button:active{background:var(--bg)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 13px;border-radius:12px;background:var(--bg);font-size:14px}
.seg button.on{background:var(--pass);color:#fff;font-weight:600}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid var(--card)}
.sw button.on{box-shadow:0 0 0 3px var(--tx)}
.acts{display:flex;gap:8px;margin-top:22px}
.bt{flex:1;padding:13px;border-radius:14px;background:var(--bg);text-align:center;font-weight:600}
.bt.pr{background:var(--pass);color:#fff;flex:2}
.bt.dg{color:#e5484d;flex:.8}
#cf{position:fixed;inset:0;pointer-events:none;z-index:20;display:none}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div><nav id="nav"></nav><div id="sheet"></div><canvas id="cf"></canvas>
<script>
const $=s=>document.querySelector(s);
const K='leave-home-v1';
const DFULL=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const KINDS={device:['📱','อุปกรณ์'],bring:['🎒','ของที่ต้องพก'],todo:['✅','ทำก่อนออกจากบ้าน']};
const COLORS=['#2f5bff','#0ea5e9','#f97316','#10b981','#ec4899','#eab308','#8b5cf6','#ef4444'];
const EMO=['📱','📲','💻','🔌','🔋','🎧','✏️','📓','👛','🔑','🪪','💧','☂️','🕶️','👟','⌚','🚪','💡','🔒','🍱'];
const uid=()=>Math.random().toString(36).slice(2,8);
const mk=(e,n,k,g)=>({id:uid(),e,n,k,g});
const dflt=()=>({groups:[{id:'d',n:'ทุกวัน',e:'🏠',c:'#2f5bff'},{id:'s',n:'ไปเรียน/ติว',e:'📚',c:'#0ea5e9'},{id:'o',n:'ไปข้างนอก',e:'🛍️',c:'#f97316'},{id:'x',n:'ออกกำลังกาย',e:'🏃',c:'#10b981'}],
items:[mk('📱','มือถือ (แบตพอไหม?)','device',['d']),mk('🎧','หูฟัง','device',['d']),mk('📲','ไอแพด','device',['s']),mk('✏️','ปากกาไอแพด','device',['s']),mk('💻','โน้ตบุ๊ก','device',['s']),mk('🔌','สายชาร์จ + หัวชาร์จ','device',['s','o']),mk('🔋','พาวเวอร์แบงก์','device',['o']),mk('⌚','นาฬิกา','device',['x']),
mk('👛','กระเป๋าสตางค์','bring',['d']),mk('🔑','กุญแจ','bring',['d']),mk('💧','ขวดน้ำ','bring',['d']),mk('📓','สมุด + ปากกา','bring',['s']),mk('🪪','บัตรประจำตัว','bring',['s','o']),mk('☂️','ร่ม','bring',['o']),mk('🕶️','แว่นกันแดด','bring',['o']),mk('👟','รองเท้ากีฬา','bring',['x']),mk('🧺','ผ้าเช็ดตัว','bring',['x']),
mk('💡','ปิดไฟ + พัดลม','todo',['d']),mk('🚪','ล็อกประตูบ้าน','todo',['d'])],
sched:{0:['d','x'],1:['d','s'],2:['d','s'],3:['d','s'],4:['d','s'],5:['d','s'],6:['d','o']},done:{d:'',ids:[]},over:{d:'',g:[]}});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.groups)S=dflt();
const save=()=>{S._t=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}push()};
const SY={off:'',wait:'☁️ กำลังเชื่อมต่อ',ok:'☁️ ซิงค์แล้ว',err:'☁️ ยังซิงค์ไม่ได้'};
const CFG={OWNER:'',REPO:'',PATH:'checklist-data.json',BRANCH:'data',TOKEN:''}; // เปิดจาก USER.github.io/ชื่อrepo ระบบดึง OWNER/REPO ให้เอง / ข้อมูลเก็บใน branch "data" (สร้างให้อัตโนมัติ)
if(/\.github\.io$/.test(location.hostname)){const h=location.hostname.split('.')[0],sg=location.pathname.split('/')[1]||'';if(!CFG.OWNER)CFG.OWNER=h;if(!CFG.REPO)CFG.REPO=sg&&!/\./.test(sg)?sg:h+'.github.io'}
const lsg=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},lss=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
const tok=()=>CFG.TOKEN||lsg(K+'-tok');
const on=()=>!!(CFG.OWNER&&CFG.REPO&&tok());
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
const ERR={401:'token ผิดหรือหมดอายุ',403:'token ไม่มีสิทธิ์ Contents: Read and write',404:'หา repo ไม่เจอ (เช็กชื่อ repo และสิทธิ์ของ token)'};
let dirty=false,busy=false,sha=null,errMsg='';
function api(method,body){
  const u=`https://api.github.com/repos/${CFG.OWNER}/${CFG.REPO}/contents/${CFG.PATH}`+(method==='GET'?`?t=${Date.now()}${CFG.BRANCH?'&ref='+CFG.BRANCH:''}`:'');
  return fetch(u,{method,cache:'no-store',headers:{Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
}
let brOk=false;
async function ensureBranch(){
  if(brOk||!CFG.BRANCH)return;
  const b=`https://api.github.com/repos/${CFG.OWNER}/${CFG.REPO}`,H={Authorization:'Bearer '+tok(),Accept:'application/vnd.github+json','Content-Type':'application/json'};
  const r=await fetch(`${b}/git/ref/heads/${CFG.BRANCH}`,{headers:H,cache:'no-store'});
  if(r.status===404){
    const rr=await fetch(b,{headers:H,cache:'no-store'});if(!rr.ok)throw new Error(rr.status);
    const d=await fetch(`${b}/git/ref/heads/${(await rr.json()).default_branch}`,{headers:H,cache:'no-store'});if(!d.ok)throw new Error(d.status);
    const c=await fetch(`${b}/git/refs`,{method:'POST',headers:H,body:JSON.stringify({ref:'refs/heads/'+CFG.BRANCH,sha:(await d.json()).object.sha})});
    if(!c.ok&&c.status!==422)throw new Error(c.status);
  }else if(!r.ok)throw new Error(r.status);
  brOk=true;
}
async function ghGet(){const r=await api('GET');if(r.status===404){sha=null;return null}if(!r.ok)throw new Error(r.status);const j=await r.json();sha=j.sha;return JSON.parse(dec(j.content))}
async function ghPut(o){
  const b={message:'checklist '+new Date().toISOString(),content:enc(JSON.stringify(o))};
  if(sha)b.sha=sha;if(CFG.BRANCH)b.branch=CFG.BRANCH;
  const r=await api('PUT',b);
  if(r.status===409||r.status===422)throw new Error('conflict');
  if(!r.ok)throw new Error(r.status);
  sha=(await r.json()).content.sha;
}
const fail=e=>{errMsg=ERR[e.message]||e.message;sync='err';if(!D)render()};
function push(){if(!on())return;dirty=true;clearTimeout(pushT);pushT=setTimeout(flush,2000)}
async function flush(){
  if(!on()||!dirty||busy)return;
  busy=true;const snap=JSON.parse(JSON.stringify(S));
  try{await ensureBranch();await ghPut(snap);if(S._t===snap._t)dirty=false;setSync('ok')}
  catch(e){if(e.message==='conflict')await pull();else fail(e)}
  busy=false;if(dirty&&sync==='ok')push();
}
async function pull(){
  if(!on())return;
  try{
    await ensureBranch();const r=await ghGet();
    if(r&&r.groups&&(r._t||0)>(S._t||0)){
      S=r;lss(K,JSON.stringify(S));
      if(S.th)document.documentElement.dataset.theme=S.th;
      if(!D)render();
    }else if(!r||(r._t||0)<(S._t||0)){
      if(!S._t)S._t=Date.now();
      dirty=true;await flush();
    }
    setSync('ok');
  }catch(e){fail(e)}
}
const ghStatus=()=>!CFG.OWNER?'ยังไม่รู้ชื่อ repo (เปิดจาก github.io หรือใส่ OWNER/REPO ใน CFG)':!tok()?'ยังไม่ได้ใส่ token':sync==='ok'?'เชื่อมต่อแล้ว':sync==='err'?'มีปัญหา: '+errMsg:'กำลังเชื่อมต่อ…';
function openTok(){
  D={t:'t'};
  $('#sheet').innerHTML='<div class="bk" data-a="x"></div><div class="pn"><div class="grab"></div><h3>เชื่อมต่อ GitHub</h3><p style="font-size:14px;color:var(--mu);margin:0 0 12px">วาง Personal Access Token (fine-grained) ที่มีสิทธิ์ <b>Contents: Read and write</b> เฉพาะ repo เก็บข้อมูล เก็บไว้ในเครื่องนี้เท่านั้น ถ้าล้างแคชต้องวางใหม่ แต่ข้อมูลไม่หาย</p><div class="f"><input id="ft" type="password" autocomplete="off" placeholder="'+(lsg(K+'-tok')?'มี token อยู่แล้ว (วางใหม่เพื่อเปลี่ยน)':'github_pat_...')+'"></div><div class="acts"><button class="bt dg" data-a="rmt">ลบ</button><button class="bt" data-a="x">ยกเลิก</button><button class="bt pr" data-a="svt">เชื่อมต่อ</button></div></div>';
  $('#sheet').classList.add('open');
}
function setSync(s){if(sync===s)return;sync=s;if(!D)render()}
if(S.th)document.documentElement.dataset.theme=S.th;
let tab='c',lastPop=null,D=null,sync='off',pushT=null,ref=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gBy=id=>S.groups.find(g=>g.id===id);
const today=()=>{const t=new Date();return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate()};
const overOn=()=>S.over.d===today();
const tgroups=()=>overOn()?S.over.g:(S.sched[new Date().getDay()]||[]);
const itemsFor=gs=>S.items.filter(i=>i.g.some(g=>gs.includes(g)));
const isDone=i=>S.done.ids.includes(i.id);
const allDone=()=>{const l=itemsFor(tgroups());return l.length>0&&l.every(isDone)};
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const chip=(g,on,at)=>`<button class="chip${on?' on':''}" style="--c:${g.c}" ${at}>${g.e} ${esc(g.n)}</button>`;

function vCheck(){
  const t=today();if(S.done.d!==t)S.done={d:t,ids:[]};
  const tg=tgroups(),its=itemsFor(tg),n=its.length,dn=its.filter(isDone).length,all=n>0&&dn===n,p=n?dn/n:0,C=163.4;
  const now=new Date(),hr=now.getHours();
  const hi=all?'พร้อมออกจากบ้านแล้ว 🎉':n===0?'วันนี้ยังไม่มีรายการ':hr<11?'อรุณสวัสดิ์ ☀️':hr<17?'สวัสดียามบ่าย 🌤️':'สวัสดียามเย็น 🌙';
  const sub=all?'ครบทุกอย่างแล้ว เดินทางปลอดภัยนะ':n?`เหลืออีก ${n-dn} อย่าง จากทั้งหมด ${n}`:'เลือกกลุ่มด้านล่างหรือตั้งตารางได้เลย';
  let h=`<div class="hero${all?' all':''}"><div class="l"><div class="dt">วัน${DFULL[now.getDay()]}ที่ ${now.getDate()}/${now.getMonth()+1}<span class="sy">${SY[sync]}</span></div><h1>${hi}</h1><p>${sub}</p></div><div class="r"><div class="ring"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" class="tr"/><circle cx="30" cy="30" r="26" class="pg" style="stroke-dasharray:${C};stroke-dashoffset:${C*(1-p)}" transform="rotate(-90 30 30)"/></svg><b>${Math.round(p*100)}%</b></div></div></div>`;
  h+=`<div class="lbl">กลุ่มของวันนี้ ${overOn()?'<button class="lnk" data-a="ro">ใช้ตารางปกติ</button>':'<span>แตะเพื่อสลับเฉพาะวันนี้</span>'}</div><div class="chips">${S.groups.map(g=>chip(g,tg.includes(g.id),`data-a="og" data-id="${g.id}"`)).join('')}</div>`;
  for(const k in KINDS){
    const l=its.filter(i=>i.k===k);if(!l.length)continue;
    h+=`<div class="sec"><span>${KINDS[k][0]} ${KINDS[k][1]}</span><em>${l.filter(isDone).length}/${l.length}</em></div><div class="list">`+l.map(i=>{
      const gs=i.g.filter(x=>tg.includes(x)).map(gBy).filter(Boolean),c=gs[0]?gs[0].c:'#2f5bff';
      return `<button class="row${isDone(i)?' done':''}${i.id===lastPop?' pop':''}" style="--c:${c}" data-a="tk" data-id="${i.id}"><span class="tile">${i.e}</span><span class="nm">${esc(i.n)}</span><span class="dots">${gs.map(g=>`<i style="--c:${g.c}"></i>`).join('')}</span><span class="ck"><svg viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9"/></svg></span></button>`}).join('')+'</div>';
  }
  return h;
}
function vSched(){
  const td=new Date().getDay();
  return `<div class="top"><h2>ตารางประจำสัปดาห์</h2><p>เลือกกลุ่มของแต่ละวัน ระบบรวมรายการให้เอง ของซ้ำนับครั้งเดียว</p></div>`+[1,2,3,4,5,6,0].map(d=>{
    const gs=S.sched[d]||[];
    return `<div class="day${d===td?' td':''}"><div class="dh"><b>วัน${DFULL[d]}</b>${d===td?'<i>วันนี้</i>':''}<span>${itemsFor(gs).length} อย่าง</span></div><div class="chips">${S.groups.map(g=>chip(g,gs.includes(g.id),`data-a="sg" data-d="${d}" data-id="${g.id}"`)).join('')}</div></div>`}).join('');
}
function vEdit(){
  let h=`<div class="top"><h2>จัดการ</h2><p>แก้กลุ่มและรายการได้ตามใจ</p></div><div class="sec"><span>🗂️ กลุ่ม</span><button class="add" data-a="ng">เพิ่มกลุ่ม</button></div><div class="list">`+S.groups.map(g=>`<button class="row" style="--c:${g.c}" data-a="eg" data-id="${g.id}"><span class="tile">${g.e}</span><span class="nm">${esc(g.n)}<small>${S.items.filter(i=>i.g.includes(g.id)).length} รายการ</small></span><span class="chev">›</span></button>`).join('')+'</div>';
  h+=`<div class="sec"><span>📋 รายการทั้งหมด</span><button class="add" data-a="ni">เพิ่มรายการ</button></div><div class="list">`+S.items.map(i=>`<button class="row" data-a="ei" data-id="${i.id}"><span class="tile">${i.e}</span><span class="nm">${esc(i.n)}<small>${KINDS[i.k][1]} · ${i.g.map(gBy).filter(Boolean).map(g=>esc(g.n)).join(', ')||'ยังไม่อยู่กลุ่มไหน'}</small></span><span class="chev">›</span></button>`).join('')+'</div>';
  h+=`<div class="sec"><span>⚙️ อื่นๆ</span></div><div class="list"><button class="row" data-a="gh"><span class="tile">🔑</span><span class="nm">เชื่อมต่อ GitHub<small>${ghStatus()}</small></span><span class="chev">›</span></button><button class="row" data-a="theme"><span class="tile">🌓</span><span class="nm">สลับโหมดสว่าง/มืด</span></button><button class="row" data-a="rst"><span class="tile">♻️</span><span class="nm">ล้างเครื่องหมายของวันนี้</span></button></div><p class="ft">${sync==='ok'?'ซิงค์กับ GitHub แล้ว ใช้ได้ทุกเครื่อง และไม่หายเมื่อล้างแคช':'ตอนนี้เก็บในเครื่องนี้ ถ้าล้างแคชข้อมูลอาจหาย (เชื่อมต่อ GitHub เพื่อซิงค์)'}</p>`;
  return h;
}
function render(){
  $('#app').innerHTML=tab==='c'?vCheck():tab==='s'?vSched():vEdit();
  $('#nav').innerHTML=[['c','✅','เช็ก'],['s','🗓️','ตาราง'],['e','🧰','จัดการ']].map(([k,e,l])=>`<button data-a="tab" data-t="${k}" class="${tab===k?'on':''}"><span>${e}</span>${l}</button>`).join('');
  lastPop=null;
}
function showSheet(){
  const it=D.t==='i';
  let b=`<div class="pn"><div class="grab"></div><h3>${D.id?'แก้ไข':'เพิ่ม'}${it?'รายการ':'กลุ่ม'}</h3><div class="f"><input id="fe" class="ei" maxlength="4" value="${D.e}" aria-label="ไอคอน"><input id="fn" placeholder="ชื่อ${it?'รายการ':'กลุ่ม'}" value="${esc(D.n)}"></div><div class="emo">${EMO.map(e=>`<button data-a="pe">${e}</button>`).join('')}</div>`;
  if(it)b+=`<div class="lbl">ประเภท</div><div class="seg">${Object.keys(KINDS).map(k=>`<button data-a="pk" data-k="${k}" class="${D.k===k?'on':''}">${KINDS[k][0]} ${KINDS[k][1]}</button>`).join('')}</div><div class="lbl">อยู่ในกลุ่ม</div><div class="chips">${S.groups.map(g=>chip(g,D.g.includes(g.id),`data-a="pg" data-id="${g.id}"`)).join('')}</div>`;
  else b+=`<div class="lbl">สีประจำกลุ่ม</div><div class="sw">${COLORS.map(c=>`<button data-a="pc" data-c="${c}" style="background:${c}" class="${D.c===c?'on':''}" aria-label="${c}"></button>`).join('')}</div>`;
  b+=`<div class="acts">${D.id?'<button class="bt dg" data-a="del">ลบ</button>':''}<button class="bt" data-a="x">ยกเลิก</button><button class="bt pr" data-a="sv">บันทึก</button></div></div>`;
  $('#sheet').innerHTML='<div class="bk" data-a="x"></div>'+b;$('#sheet').classList.add('open');
}
const closeSheet=()=>{$('#sheet').classList.remove('open');D=null};
function boom(){
  const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;c.style.display='block';
  const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*5+3,c:COLORS[Math.random()*8|0],a:Math.random()*6}));let f=0;
  (function L(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<110)requestAnimationFrame(L);else c.style.display='none'})();
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a==='tab'){tab=b.dataset.t;render();scrollTo(0,0);return}
  if(a==='tk'){const ids=S.done.ids,i=ids.indexOf(id),was=allDone();if(i<0){ids.push(id);vib(12)}else ids.splice(i,1);lastPop=id;save();render();if(!was&&allDone()){boom();vib([30,40,70])}return}
  if(a==='og'){const g=tgroups().slice(),i=g.indexOf(id);i<0?g.push(id):g.splice(i,1);S.over={d:today(),g};save();render();return}
  if(a==='ro'){S.over={d:'',g:[]};save();render();return}
  if(a==='sg'){const d=b.dataset.d,g=S.sched[d]=(S.sched[d]||[]).slice(),i=g.indexOf(id);i<0?g.push(id):g.splice(i,1);save();render();return}
  if(a==='theme'){const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');S.th=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=S.th;save();return}
  if(a==='rst'){S.done={d:today(),ids:[]};save();tab='c';render();return}
  if(a==='ni'){D={t:'i',e:'📌',n:'',k:'bring',g:tgroups().slice()};showSheet();return}
  if(a==='ei'){const i=S.items.find(x=>x.id===id);D={t:'i',id,e:i.e,n:i.n,k:i.k,g:[...i.g]};showSheet();return}
  if(a==='ng'){D={t:'g',e:'⭐',n:'',c:COLORS[S.groups.length%8]};showSheet();return}
  if(a==='eg'){const g=gBy(id);D={t:'g',id,e:g.e,n:g.n,c:g.c};showSheet();return}
  if(a==='gh'){openTok();return}
  if(a==='svt'){const v=$('#ft').value.trim();if(v)lss(K+'-tok',v);closeSheet();if(on()){sync='wait';render();pull()}else render();return}
  if(a==='rmt'){lss(K+'-tok','');closeSheet();sync='off';render();return}
  if(a==='x'){closeSheet();return}
  if(a==='pe'){$('#fe').value=b.textContent;return}
  if(a==='pk'){D.k=b.dataset.k;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');return}
  if(a==='pc'){D.c=b.dataset.c;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');return}
  if(a==='pg'){const i=D.g.indexOf(id);i<0?D.g.push(id):D.g.splice(i,1);b.classList.toggle('on');return}
  if(a==='sv'){
    D.e=$('#fe').value.trim()||'📌';D.n=$('#fn').value.trim();
    if(!D.n){$('#fn').focus();return}
    if(D.t==='i'){const o={id:D.id||uid(),e:D.e,n:D.n,k:D.k,g:D.g};const i=S.items.findIndex(x=>x.id===D.id);i<0?S.items.push(o):S.items[i]=o}
    else{const o={id:D.id||uid(),e:D.e,n:D.n,c:D.c};const i=S.groups.findIndex(x=>x.id===D.id);i<0?S.groups.push(o):S.groups[i]=o}
    save();closeSheet();render();return;
  }
  if(a==='del'){
    if(D.t==='i')S.items=S.items.filter(x=>x.id!==D.id);
    else{const g=D.id;S.groups=S.groups.filter(x=>x.id!==g);S.items.forEach(i=>i.g=i.g.filter(x=>x!==g));for(const d in S.sched)S.sched[d]=S.sched[d].filter(x=>x!==g);S.over.g=S.over.g.filter(x=>x!==g)}
    save();closeSheet();render();
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!D)render()});
function initSync(){
  if(!on())return;
  sync='wait';pull();
}
document.addEventListener('visibilitychange',()=>{if(on()&&!document.hidden)dirty?flush():pull()});
addEventListener('online',()=>{if(on())dirty?flush():pull()});
render();
initSync();
</script>
</body>
</html>
